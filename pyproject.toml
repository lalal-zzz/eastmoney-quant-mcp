[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eastmoney-quant-mcp"
version = "0.3.0"
description = "东方财富量化 MCP 服务 - 股票数据下载、人气榜单、板块分析、形态选股 AI 助手"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "lalal-zzz", email = "lalal-zzz@users.noreply.github.com" }
]
keywords = ["eastmoney", "stock", "quant", "mcp", "ai", "china-stock"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "mcp[cli]>=1.0.0",
    "akshare>=1.14.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "curl_cffi>=0.6.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
browser = [
    "playwright>=1.40.0",
]

[project.scripts]
eastmoney-quant-mcp = "eastmoney_quant_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eastmoney_quant_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 真实网络+写库的集成测试, 需显式 pytest -m integration 运行",
]
addopts = "-m 'not integration'"
